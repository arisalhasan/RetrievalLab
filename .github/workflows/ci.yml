name: Tests
on: [push, pull_request]
jobs:
  offline-tests:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: x64
          cache: pip
          cache-dependency-path: requirements-release.lock.txt
      - name: Create isolated Python environment
        run: python -m venv .venv
      - run: .\.venv\Scripts\python.exe -m pip install -r requirements-release.lock.txt
      - run: .\.venv\Scripts\python.exe -m pip install --no-deps --no-build-isolation -e .
      - run: .\.venv\Scripts\python.exe -m pip check
      - run: .\.venv\Scripts\python.exe -m ruff check .
      - run: .\.venv\Scripts\python.exe -m ruff format --check .
      - run: .\.venv\Scripts\python.exe -m pytest --basetemp runs/pytest-ci --junitxml=runs/pytest-ci.xml
